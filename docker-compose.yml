version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studentlifehelper-backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./student-life-helper-ui
      dockerfile: Dockerfile
    container_name: studentlifehelper-frontend
    restart: always
    ports:
      - "4000:80"

  db:
    image: postgres:16
    container_name: studentlifehelper-db
    restart: always
    environment:
      POSTGRES_DB: StudentLifeHelperDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: --__77__ILoveDildora__77__--
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: